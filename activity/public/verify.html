<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Confirm your email — Emberlone</title>
<!-- Standalone for the same reason as reset.html: opened from an email client
     on an unknown device, and must not depend on the game bundle or on being
     signed in. -->
<style>
  :root { --void:#120E18; --gold:#E8C56A; --goldhi:#F2D98A; --ink:#F5EFE3;
          --dim:#A99BC0; --ok:#46C07A; --bad:#E0405C; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px;
    background: radial-gradient(ellipse at 50% 0%, #2A1F3D, var(--void) 62%);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card { width:100%; max-width:380px; text-align:center; }
  h1 { font-family: ui-serif, Georgia, serif; letter-spacing:.22em; font-size:26px;
       color: var(--goldhi); margin:0 0 6px; font-weight:600; }
  .sub { color:var(--dim); font-size:12px; letter-spacing:.16em; text-transform:uppercase; margin:0 0 28px; }
  .msg { padding:12px 14px; border-radius:10px; font-size:13px; line-height:1.55; }
  .msg.err { border:1px solid rgba(224,64,92,.4); background:rgba(224,64,92,.1); color:#FF9DAD; }
  .msg.ok  { border:1px solid rgba(70,192,122,.4); background:rgba(70,192,122,.1); color:#7FD9A4; }
  .msg.wait{ border:1px solid rgba(232,197,106,.3); background:rgba(232,197,106,.07); color:var(--goldhi); }
  .hint { margin-top:18px; font-size:11px; color:#6F6484; line-height:1.6; }
</style>
</head>
<body>
<div class="card">
  <h1>EMBERLONE</h1>
  <p class="sub">Email confirmation</p>
  <div id="msg" class="msg wait">Confirming…</div>
  <p class="hint">You can close this page when it's done.</p>
</div>
<script>
  var token = new URLSearchParams(location.search).get("token") || "";
  var msg = document.getElementById("msg");
  function say(t, k) { msg.className = "msg " + k; msg.textContent = t; }

  if (!token) {
    say("That link is missing its token. Open the link from your email again.", "err");
  } else {
    fetch("/api/auth/email/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok && res.j.ok !== false) {
          say("Confirmed. If you ever forget your password, you can now recover this account.", "ok");
        } else {
          say(res.j.message || "That link has expired or was already used.", "err");
        }
      })
      .catch(function () { say("Could not reach the server. Try the link again shortly.", "err"); });
  }
</script>
</body>
</html>
