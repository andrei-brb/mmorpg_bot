<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Reset your password — Emberlone</title>
<!--
  Deliberately a standalone static page, not a route in the React app.

  The app's router lives inside ActivityGate, which authenticates on mount — so
  any route there is unreachable to the exact person who needs this: someone who
  cannot log in. This page has no auth, no bundle, and no dependency on the game
  loading at all.

  It is also opened from an email client on an unknown device, so it must stand
  on its own. It only needs the API base URL and the token from the query string.
-->
<style>
  :root {
    --void:#120E18; --panel:#1F1829; --line:#3A2E4D;
    --gold:#E8C56A; --goldhi:#F2D98A; --goldmid:#C9A24B;
    --ink:#F5EFE3; --dim:#A99BC0; --ok:#46C07A; --bad:#E0405C;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px;
    background: radial-gradient(ellipse at 50% 0%, #2A1F3D, var(--void) 62%);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card { width:100%; max-width:380px; }
  h1 {
    font-family: ui-serif, Georgia, serif; letter-spacing:.22em; font-size:26px;
    color: var(--goldhi); text-align:center; margin:0 0 6px; font-weight:600;
  }
  .sub { text-align:center; color:var(--dim); font-size:12px; letter-spacing:.16em;
         text-transform:uppercase; margin:0 0 28px; }
  label { display:block; font-size:11px; color:var(--dim); margin:0 0 6px; }
  input {
    width:100%; padding:11px 12px; border-radius:12px; font-size:15px;
    background: rgba(0,0,0,.4); border:1px solid rgba(232,197,106,.25);
    color: var(--ink); outline:none;
  }
  input:focus { border-color: rgba(232,197,106,.6); }
  .row { margin-bottom:14px; }
  button {
    width:100%; padding:13px; border:0; border-radius:12px; cursor:pointer;
    font-family: ui-serif, Georgia, serif; letter-spacing:.16em; font-size:14px;
    color:#221803; background: linear-gradient(180deg, #F2D98A, #C9A24B);
    box-shadow: 0 4px 16px -4px rgba(232,197,106,.5);
  }
  button:disabled { opacity:.55; cursor:default; }
  .msg { margin-top:14px; padding:10px 12px; border-radius:10px; font-size:12.5px; line-height:1.5; }
  .msg.err { border:1px solid rgba(224,64,92,.4); background:rgba(224,64,92,.1); color:#FF9DAD; }
  .msg.ok  { border:1px solid rgba(70,192,122,.4); background:rgba(70,192,122,.1); color:#7FD9A4; }
  .hint { margin-top:18px; text-align:center; font-size:11px; color:#6F6484; line-height:1.6; }
</style>
</head>
<body>
<div class="card">
  <h1>EMBERLONE</h1>
  <p class="sub">Choose a new password</p>

  <form id="f">
    <div class="row">
      <label for="p">New password</label>
      <input id="p" type="password" autocomplete="new-password" placeholder="At least 8 characters" />
    </div>
    <div class="row">
      <label for="p2">Confirm it</label>
      <input id="p2" type="password" autocomplete="new-password" placeholder="Type it again" />
    </div>
    <button id="go" type="submit">SET NEW PASSWORD</button>
  </form>

  <div id="msg"></div>
  <p class="hint">Once it's changed, sign in with your new password in the app.</p>
</div>

<script>
  // Same resolution the app uses: this page is served from the Activity's own
  // origin, which proxies /api through to the backend.
  var API_BASE = "";
  var token = new URLSearchParams(location.search).get("token") || "";

  var msg = document.getElementById("msg");
  var go = document.getElementById("go");

  function say(text, kind) {
    msg.className = "msg " + kind;
    msg.textContent = text;
  }

  if (!token) {
    say("That link is missing its token. Open the link from your email again, or request a new one from the app.", "err");
    go.disabled = true;
  }

  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var p = document.getElementById("p").value;
    var p2 = document.getElementById("p2").value;

    if (p.length < 8) { say("Password must be at least 8 characters.", "err"); return; }
    // Checked here as well as server-side: a typo'd confirmation should not
    // consume the single-use reset token.
    if (p !== p2) { say("Those two passwords don't match.", "err"); return; }

    go.disabled = true;
    say("Working…", "ok");

    fetch(API_BASE + "/api/auth/password/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, password: p })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok && res.j.ok !== false) {
          say("Done — your password is changed. You can close this page and sign in.", "ok");
          document.getElementById("f").style.display = "none";
        } else {
          say(res.j.message || res.j.error || "Could not reset the password.", "err");
          go.disabled = false;
        }
      })
      .catch(function () {
        say("Could not reach the server. Check your connection and try again.", "err");
        go.disabled = false;
      });
  });
</script>
</body>
</html>
