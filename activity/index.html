<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World of Discord</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        try {
          var key = "discord_activity_mock_preview";
          var combatMockKey = "discord_activity_mock_combat_view";

          function mockParamFromHash() {
            var h = window.location.hash.replace(/^#/, "");
            if (!h) return null;
            if (h.charAt(0) === "?") h = h.slice(1);
            try {
              return new URLSearchParams(h).get("mock");
            } catch (_) {
              return null;
            }
          }

          var q = new URLSearchParams(window.location.search);
          var mockQ = q.get("mock");
          var mockH = mockParamFromHash();
          var mock = mockQ !== null ? mockQ : mockH;

          if (mock === "1") {
            localStorage.setItem(key, "1");
            document.documentElement.classList.add("preview-full-mock");
          } else if (mock === "0") {
            localStorage.removeItem(key);
            localStorage.removeItem(combatMockKey);
            document.documentElement.classList.remove("preview-full-mock");
            delete document.documentElement.dataset.mockCombatView;
          } else if (localStorage.getItem(key) === "1") {
            document.documentElement.classList.add("preview-full-mock");
          }

          if (document.documentElement.classList.contains("preview-full-mock")) {
            document.documentElement.dataset.mockCombatView =
              localStorage.getItem(combatMockKey) === "fight" ? "fight" : "prep";
          }
        } catch (_) {}
      })();
    </script>
    <script>
      (function () {
        /* Discord Activity often drops ?query= from the iframe URL; hash + title gesture still work. */
        var clicks = 0;
        var timer = null;
        document.addEventListener(
          "click",
          function (e) {
            var el = e.target && e.target.closest && e.target.closest(".v0-header-row h1");
            if (!el) return;
            clicks += 1;
            clearTimeout(timer);
            timer = setTimeout(function () {
              clicks = 0;
            }, 900);
            if (clicks < 3) return;
            clicks = 0;
            try {
              var key = "discord_activity_mock_preview";
              var sub = "discord_activity_mock_combat_view";
              if (localStorage.getItem(key) === "1") {
                localStorage.removeItem(key);
                localStorage.removeItem(sub);
                document.documentElement.classList.remove("preview-full-mock");
                delete document.documentElement.dataset.mockCombatView;
              } else {
                localStorage.setItem(key, "1");
                document.documentElement.classList.add("preview-full-mock");
                document.documentElement.dataset.mockCombatView =
                  localStorage.getItem(sub) === "fight" ? "fight" : "prep";
              }
              location.reload();
            } catch (_) {}
          },
          true,
        );
      })();
    </script>
    <script>
      (function () {
        function initMockCombatToggle() {
          var root = document.documentElement;
          if (!root.classList.contains("preview-full-mock")) return;
          var KEY = "discord_activity_mock_combat_view";

          var bar = document.createElement("div");
          bar.className = "mock-combat-subtoggle";
          bar.setAttribute("role", "group");
          bar.setAttribute("aria-label", "Combat tab mock");
          bar.innerHTML =
            '<span class="mock-combat-subtoggle__label">Combat mock</span>' +
            '<button type="button" data-view="prep">Enemy select</button>' +
            '<button type="button" data-view="fight">In combat</button>';

          function syncButtons() {
            var v = root.dataset.mockCombatView === "fight" ? "fight" : "prep";
            bar.querySelectorAll("button").forEach(function (b) {
              b.classList.toggle("active", b.getAttribute("data-view") === v);
            });
          }

          bar.addEventListener("click", function (e) {
            var t = e.target;
            if (t.tagName !== "BUTTON") return;
            var v = t.getAttribute("data-view");
            if (v !== "prep" && v !== "fight") return;
            root.dataset.mockCombatView = v;
            try {
              localStorage.setItem(KEY, v);
            } catch (_) {}
            syncButtons();
          });

          document.body.appendChild(bar);
          syncButtons();
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", initMockCombatToggle);
        } else {
          initMockCombatToggle();
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
