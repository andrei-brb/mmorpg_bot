[phases.setup]
nixPkgs = ["python311", "pip", "gcc", "gccStdenv", "libffi", "openssl", "pkg-config", "zlib"]

[phases.install]
cmds = [
  "pip install --upgrade pip setuptools wheel",
  "pip install --only-binary :all: -r requirements.txt || pip install -r requirements.txt"
]

[start]
cmd = "python main.py"
