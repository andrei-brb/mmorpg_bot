# ── World of Discord — docker-compose ────────────────────────────────────────
# Usage:
#   1. Copy .env.example to .env and fill in your secrets
#   2. docker compose up -d
#   3. View logs: docker compose logs -f bot
#   4. Stop: docker compose down

version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mmorpg
      POSTGRES_USER: mmorpg_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmorpg_user -d mmorpg"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Discord Bot ──────────────────────────────────────────────────────────
  bot:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DATABASE_URL: postgresql://mmorpg_user:${DB_PASSWORD:-changeme}@db:5432/mmorpg
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    env_file:
      - .env

volumes:
  pgdata:
